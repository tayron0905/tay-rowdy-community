name: Check Minecraft server status

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: server-status-and-pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Ping Minecraft Java server
        id: ping
        run: |
          python3 scripts/check_server_status.py | tee /tmp/status-result
          grep '^changed=' /tmp/status-result >> "$GITHUB_OUTPUT"
      - name: Save changed status
        if: steps.ping.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/server-status.json
          git commit -m "Update Minecraft server status"
          git push
      - uses: actions/setup-node@v4
        if: steps.ping.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build website
        if: steps.ping.outputs.changed == 'true'
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        if: steps.ping.outputs.changed == 'true'
        with:
          path: dist
      - name: Deploy status update
        if: steps.ping.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ github.token }}
